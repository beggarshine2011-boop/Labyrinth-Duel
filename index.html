<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>迷宮の探索者 - Labyrinth Duel</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts (Inter & Noto Serif JP) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #1c1917;
      color: #f5f5f4;
    }
    .font-serif-jp {
      font-family: 'Noto Serif JP', serif;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .animate-shake {
      animation: shake 0.4s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-amber-500 selection:text-stone-950">

  <!-- TOAST NOTIFICATION -->
  <div id="toast-container" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 hidden">
    <div class="bg-amber-950/95 border border-amber-500 text-amber-200 px-4 py-2 rounded-xl shadow-2xl text-xs sm:text-sm font-bold flex items-center space-x-2">
      <i data-lucide="info" class="w-4 h-4 text-amber-400 shrink-0"></i>
      <span id="toast-text"></span>
    </div>
  </div>

  <!-- HEADER -->
  <header class="bg-stone-950 border-b border-stone-800 px-4 py-3 flex flex-wrap justify-between items-center shadow-lg gap-2">
    <div class="flex items-center space-x-3">
      <div class="bg-amber-600 text-stone-950 font-bold px-2 py-0.5 rounded tracking-wider text-xs">
        DQ STYLE
      </div>
      <h1 class="text-xl md:text-2xl font-extrabold text-amber-400 tracking-wide font-serif-jp">
        迷宮の探索者 <span class="text-stone-500 text-xs font-sans font-normal ml-1">Labyrinth Duel</span>
      </h1>
    </div>

    <div class="flex items-center space-x-3 text-xs">
      <div id="sync-badge" class="bg-stone-900 border border-stone-700 text-stone-400 px-2.5 py-1 rounded-lg flex items-center space-x-1.5">
        <i data-lucide="wifi" class="w-3.5 h-3.5"></i>
        <span class="font-bold">接続準備中...</span>
      </div>

      <div id="header-room-info" class="hidden bg-stone-900 px-3 py-1 rounded-lg border border-stone-800 flex items-center space-x-2">
        <span class="text-stone-400">ROOM:</span>
        <span id="header-room-id" class="font-mono font-bold text-amber-300"></span>
        <span id="header-player-count" class="bg-amber-950 text-amber-300 px-2 py-0.5 rounded text-[10px] font-bold"></span>
      </div>

      <button id="btn-mute" class="p-2 bg-stone-800 hover:bg-stone-700 rounded-lg text-stone-300 transition" title="効果音ON/OFF">
        <i id="icon-sound" data-lucide="volume-2" class="w-4 h-4 text-amber-400"></i>
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main id="app-root" class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 flex flex-col gap-6"></main>

  <!-- BATTLE MODAL -->
  <div id="battle-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-stone-950 border-2 border-amber-600/80 rounded-2xl p-6 max-w-md w-full shadow-2xl text-center">
      <h3 id="battle-enemy-name" class="text-2xl font-bold text-amber-400 font-serif-jp mb-1"></h3>
      <p class="text-xs text-stone-400 mb-6">目標HP: <span id="battle-enemy-hp" class="text-amber-300 font-bold text-sm"></span> 以上で討伐成功</p>

      <div class="bg-stone-900 p-4 rounded-xl border border-stone-800 mb-6 grid grid-cols-3 gap-2 text-center text-xs">
        <div>
          <div class="text-stone-400">勇者攻撃力</div>
          <div id="battle-player-atk" class="text-lg font-bold text-amber-300">5</div>
        </div>
        <div>
          <div class="text-stone-400">ダイス出目</div>
          <div id="battle-dice-val" class="text-lg font-bold text-amber-400 font-mono">+ ?</div>
        </div>
        <div>
          <div class="text-stone-400">合計数値</div>
          <div id="battle-total-val" class="text-lg font-bold text-emerald-400 font-mono">?</div>
        </div>
      </div>

      <div class="my-6 flex justify-center">
        <div id="battle-dice-box" class="w-20 h-20 bg-amber-500 text-stone-950 rounded-2xl border-4 border-amber-300 flex items-center justify-center text-4xl font-extrabold font-mono shadow-xl">
          🎲
        </div>
      </div>

      <button id="btn-roll-dice" class="w-full bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-stone-950 font-bold py-3.5 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-base disabled:opacity-50">
        <i data-lucide="dices" class="w-5 h-5"></i>
        <span id="btn-roll-text">サイコロを振る！</span>
      </button>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-stone-950 border-t border-stone-800 py-3 text-center text-xs text-stone-500">
    迷宮の探索者 (Labyrinth Duel) — 2人/3人対応 Cyclic Maze Battle
  </footer>

  <!-- APPLICATION SCRIPT (ES MODULE WITH FIREBASE CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- FIREBASE INITIALIZATION ---
    let app, auth, db;
    let appId = typeof __app_id !== 'undefined' ? __app_id : 'labyrinth-duel-20679';

    const defaultFirebaseConfig = {
      apiKey: "AIzaSyBxpjFEJlhT6MMV2fHnF_kjIDVpbvQ_GRo",
      authDomain: "labyrinth-duel-20679.firebaseapp.com",
      projectId: "labyrinth-duel-20679",
      storageBucket: "labyrinth-duel-20679.firebasestorage.app",
      messagingSenderId: "852195749840",
      appId: "1:852195749840:web:fc1d9e66f8ee90815a13d5"
    };

    try {
      const config = (typeof __firebase_config !== 'undefined' && __firebase_config)
        ? JSON.parse(__firebase_config)
        : defaultFirebaseConfig;
      app = initializeApp(config);
      auth = getAuth(app);
      db = getFirestore(app);
    } catch (e) {
      console.error("Firebase init error:", e);
    }

    // --- WEB AUDIO SYNTHESIZER ---
    class SoundSynth {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      playTone(freq, type, duration, gainVal = 0.1) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }
      step() { this.playTone(300, 'triangle', 0.08, 0.08); }
      wall() { this.playTone(120, 'square', 0.2, 0.15); }
      chest() {
        this.playTone(523.25, 'sine', 0.1, 0.1);
        setTimeout(() => this.playTone(659.25, 'sine', 0.15, 0.1), 100);
        setTimeout(() => this.playTone(783.99, 'sine', 0.2, 0.1), 200);
      }
      dice() {
        for (let i = 0; i < 4; i++) {
          setTimeout(() => this.playTone(200 + Math.random() * 400, 'square', 0.04, 0.05), i * 60);
        }
      }
      fanfare() {
        [523.25, 659.25, 783.99, 1046.50].forEach((n, i) => {
          setTimeout(() => this.playTone(n, 'triangle', 0.3, 0.15), i * 150);
        });
      }
      defeat() {
        this.playTone(300, 'sawtooth', 0.2, 0.15);
        setTimeout(() => this.playTone(200, 'sawtooth', 0.3, 0.15), 200);
      }
      teleport() {
        this.playTone(800, 'sine', 0.1, 0.1);
        setTimeout(() => this.playTone(400, 'sine', 0.2, 0.1), 80);
      }
    }
    const audio = new SoundSynth();

    // --- CONSTANTS & RULES ---
    const B1_SIZE = 10;
    const B2_SIZE = 6;
    const COLS_B1 = ['A','B','C','D','E','F','G','H','I','J'];
    const COLS_B2 = ['A','B','C','D','E','F'];

    const MONSTER_TYPES = [
      { id: 'slime_knight', name: 'スライムナイト', hp: 8, icon: '🛡️' },
      { id: 'golem', name: 'ゴーレム', hp: 9, icon: '🗿' },
      { id: 'dragon', name: 'ドラゴン', hp: 10, icon: '🐉' }
    ];

    const CARD_TYPES = [
      { id: 'impas', name: '鑑定の巻物', desc: '相手の宝箱の中身を感知' },
      { id: 'riremito', name: '脱出の翼', desc: 'B2FからB1F落とし穴へ即時脱出' },
      { id: 'yamabiko', name: '共鳴の笛', desc: '未発見アイテムの方向を特定' },
      { id: 'zaki', name: '死の呪文', desc: '雑魚・ミミックをダイスなしで撃破' },
      { id: 'sekaiju', name: '奇跡の雫', desc: '敗北時の1回休みペナルティ無効' },
      { id: 'stone', name: 'ただの石ころ', desc: '丸い小石' }
    ];

    const LEVEL_RULES = {
      1: { name: 'レベル1：入門', walls: 24, b2: false, chests: 0, monsters: 0, princess: false },
      2: { name: 'レベル2：標準', walls: 28, b2: true, chests: 6, monsters: 0, princess: false },
      3: { name: 'レベル3：上級', walls: 28, b2: true, chests: 6, monsters: 8, princess: true }
    };

    const createEmptyGrid = (rows, cols) => {
      return Array.from({ length: rows }, () =>
        Array.from({ length: cols }, () => ({ type: 'empty', details: null }))
      );
    };

    // --- BFS PATHFINDING VALIDATOR ---
    function validateDungeon(dungeon, level) {
      const rule = LEVEL_RULES[level];
      const { b1, b2 } = dungeon;
      let startCount = 0, bossCount = 0, pitfallCount = 0, landingCount = 0, ladderCount = 0;
      let chestCount = 0, monsterCount = 0, princessCount = 0, wallCount = 0;
      let startPos = null, bossPos = null, pitfallPos = null, landingPos = null;

      for (let r = 0; r < B1_SIZE; r++) {
        for (let c = 0; c < B1_SIZE; c++) {
          const cell = b1[r][c];
          if (cell.type === 'wall') wallCount++;
          if (cell.type === 'start') { startCount++; startPos = { floor: 'b1', r, c }; }
          if (cell.type === 'boss') { bossCount++; bossPos = { floor: 'b1', r, c }; }
          if (cell.type === 'pitfall') { pitfallCount++; pitfallPos = { floor: 'b1', r, c }; }
          if (cell.type === 'chest') chestCount++;
          if (cell.type === 'monster') monsterCount++;
          if (cell.type === 'princess') princessCount++;
        }
      }

      if (rule.b2) {
        for (let r = 0; r < B2_SIZE; r++) {
          for (let c = 0; c < B2_SIZE; c++) {
            const cell = b2[r][c];
            if (cell.type === 'wall') wallCount++;
            if (cell.type === 'boss') { bossCount++; bossPos = { floor: 'b2', r, c }; }
            if (cell.type === 'landing') { landingCount++; landingPos = { floor: 'b2', r, c }; }
            if (cell.type === 'ladder') ladderCount++;
            if (cell.type === 'chest') chestCount++;
            if (cell.type === 'monster') monsterCount++;
            if (cell.type === 'princess') princessCount++;
          }
        }
      }

      if (startCount !== 1) return { valid: false, msg: 'スタート地点を1つ配置してください' };
      if (bossCount !== 1) return { valid: false, msg: '魔王（大ボス）を1つ配置してください' };
      if (wallCount !== rule.walls) return { valid: false, msg: `壁ブロックを合計 ${rule.walls} 個配置してください（現在: ${wallCount}個）` };

      if (rule.b2) {
        if (pitfallCount !== 1) return { valid: false, msg: '落とし穴（B1F）を1つ配置してください' };
        if (landingCount !== 1) return { valid: false, msg: '着地点（B2F）を1つ配置してください' };
        if (ladderCount !== 1) return { valid: false, msg: 'ハシゴ（B2F）を1つ配置してください' };
      }

      if (chestCount !== rule.chests) return { valid: false, msg: `宝箱を ${rule.chests} 個配置してください（現在: ${chestCount}個）` };
      if (monsterCount !== rule.monsters) return { valid: false, msg: `モンスターを ${rule.monsters} 体配置してください（現在: ${monsterCount}体）` };
      if (rule.princess && princessCount !== 1) return { valid: false, msg: '王女を1人配置してください' };

      const visited = new Set([`b1_${startPos.r}_${startPos.c}`]);
      const queue = [startPos];
      let bossReached = false;

      while (queue.length > 0) {
        const curr = queue.shift();
        if (curr.floor === bossPos.floor && curr.r === bossPos.r && curr.c === bossPos.c) {
          bossReached = true;
          break;
        }
        const isB1 = curr.floor === 'b1';
        const grid = isB1 ? b1 : b2;
        const size = isB1 ? B1_SIZE : B2_SIZE;
        const currentCell = grid[curr.r][curr.c];

        if (isB1 && currentCell.type === 'pitfall' && landingPos) {
          const key = `b2_${landingPos.r}_${landingPos.c}`;
          if (!visited.has(key)) { visited.add(key); queue.push({ floor: 'b2', r: landingPos.r, c: landingPos.c }); }
        } else if (!isB1 && currentCell.type === 'ladder' && pitfallPos) {
          const key = `b1_${pitfallPos.r}_${pitfallPos.c}`;
          if (!visited.has(key)) { visited.add(key); queue.push({ floor: 'b1', r: pitfallPos.r, c: pitfallPos.c }); }
        }

        for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
          const nr = curr.r + dr, nc = curr.c + dc;
          if (nr >= 0 && nr < size && nc >= 0 && nc < size && grid[nr][nc].type !== 'wall') {
            const key = `${curr.floor}_${nr}_${nc}`;
            if (!visited.has(key)) { visited.add(key); queue.push({ floor: curr.floor, r: nr, c: nc }); }
          }
        }
      }

      if (!bossReached) return { valid: false, msg: 'スタートから魔王までの通行可能なルートが存在しません！' };
      return { valid: true, msg: '迷宮構造は正常です！' };
    }

    // --- AUTO DUNGEON GENERATOR ---
    function generateRandomDungeon(level) {
      const rule = LEVEL_RULES[level];
      let attempts = 0;
      while (attempts < 250) {
        attempts++;
        const b1 = createEmptyGrid(B1_SIZE, B1_SIZE);
        const b2 = rule.b2 ? createEmptyGrid(B2_SIZE, B2_SIZE) : null;

        const sr = Math.floor(Math.random() * B1_SIZE);
        const sc = Math.floor(Math.random() * B1_SIZE);
        b1[sr][sc] = { type: 'start', details: null };

        if (rule.b2 && Math.random() > 0.5) {
          b2[Math.floor(Math.random() * B2_SIZE)][Math.floor(Math.random() * B2_SIZE)] = { type: 'boss', details: null };
        } else {
          let br, bc;
          do { br = Math.floor(Math.random() * B1_SIZE); bc = Math.floor(Math.random() * B1_SIZE); } while (br === sr && bc === sc);
          b1[br][bc] = { type: 'boss', details: null };
        }

        if (rule.b2) {
          let pr, pc; do { pr = Math.floor(Math.random() * B1_SIZE); pc = Math.floor(Math.random() * B1_SIZE); } while (b1[pr][pc].type !== 'empty');
          b1[pr][pc] = { type: 'pitfall', details: null };
          let lr, lc; do { lr = Math.floor(Math.random() * B2_SIZE); lc = Math.floor(Math.random() * B2_SIZE); } while (b2[lr][lc].type !== 'empty');
          b2[lr][lc] = { type: 'landing', details: null };
          let ldr, ldc; do { ldr = Math.floor(Math.random() * B2_SIZE); ldc = Math.floor(Math.random() * B2_SIZE); } while (b2[ldr][ldc].type !== 'empty');
          b2[ldr][ldc] = { type: 'ladder', details: null };
        }

        if (rule.chests > 0) {
          for (const ctype of ['sword', 'armor', 'mimic', 'mimic', 'mimic', 'mimic']) {
            const targetGrid = (rule.b2 && Math.random() > 0.5) ? b2 : b1;
            const size = targetGrid === b1 ? B1_SIZE : B2_SIZE;
            let r, c, ca = 0;
            do { r = Math.floor(Math.random() * size); c = Math.floor(Math.random() * size); ca++; } while (targetGrid[r][c].type !== 'empty' && ca < 50);
            if (targetGrid[r][c].type === 'empty') targetGrid[r][c] = { type: 'chest', details: { chestType: ctype } };
          }
        }

        if (rule.monsters > 0) {
          for (let i = 0; i < rule.monsters; i++) {
            const mType = MONSTER_TYPES[i % MONSTER_TYPES.length];
            const targetGrid = (rule.b2 && Math.random() > 0.5) ? b2 : b1;
            const size = targetGrid === b1 ? B1_SIZE : B2_SIZE;
            let r, c, ma = 0;
            do { r = Math.floor(Math.random() * size); c = Math.floor(Math.random() * size); ma++; } while (targetGrid[r][c].type !== 'empty' && ma < 50);
            if (targetGrid[r][c].type === 'empty') targetGrid[r][c] = { type: 'monster', details: { ...mType } };
          }
        }

        if (rule.princess) {
          const targetGrid = (rule.b2 && Math.random() > 0.5) ? b2 : b1;
          const size = targetGrid === b1 ? B1_SIZE : B2_SIZE;
          let r, c, pa = 0;
          do { r = Math.floor(Math.random() * size); c = Math.floor(Math.random() * size); pa++; } while (targetGrid[r][c].type !== 'empty' && pa < 50);
          if (targetGrid[r][c].type === 'empty') targetGrid[r][c] = { type: 'princess', details: null };
        }

        let wallsToPlace = rule.walls, wa = 0;
        while (wallsToPlace > 0 && wa < 300) {
          wa++;
          const targetGrid = (rule.b2 && Math.random() > 0.6) ? b2 : b1;
          const size = targetGrid === b1 ? B1_SIZE : B2_SIZE;
          const r = Math.floor(Math.random() * size), c = Math.floor(Math.random() * size);
          if (targetGrid[r][c].type === 'empty') { targetGrid[r][c] = { type: 'wall', details: null }; wallsToPlace--; }
        }

        if (validateDungeon({ b1, b2 }, level).valid) return { b1, b2 };
      }
      return { b1: createEmptyGrid(B1_SIZE, B1_SIZE), b2: createEmptyGrid(B2_SIZE, B2_SIZE) };
    }

    // --- GLOBAL APPLICATION STATE ---
    const state = {
      nickname: localStorage.getItem('ld_nickname') || `勇者${Math.floor(10 + Math.random() * 90)}`,
      user: null,
      roomId: '',
      inputRoomId: '',
      isLocalDemo: false,
      myPlayerIndex: 0,
      demoViewIndex: 0,
      syncStatus: 'connecting', // 'connecting' | 'online' | 'error' | 'local'
      syncErrorMsg: '',
      gameState: null,
      selectedLevel: 2,
      selectedPlayerCount: 3,

      // Builder
      builderFloor: 'b1',
      selectedTool: 'wall',
      chestSubtype: 'sword',
      monsterSubtype: 0,
      builderDungeon: { b1: createEmptyGrid(B1_SIZE, B1_SIZE), b2: createEmptyGrid(B2_SIZE, B2_SIZE) },

      // Explore & View
      radarFloor: 'b1',
      defenseFloor: 'b1',
      spectateFloor: 'b1',
      mainViewMode: 'explore', // 'explore' | 'defense' | 'spectate'
      autoFollowTurn: true,
      activeMemoTool: 'cross',
      lastTurnIndex: null,

      // Combat & FX
      battleModal: null,
      diceValue: null,
      diceRolling: false,
      hitNotification: null,
      screenShake: false
    };

    let unsubscribeRoom = null;

    // --- UI HELPERS ---
    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const text = document.getElementById('toast-text');
      text.textContent = msg;
      container.classList.remove('hidden');
      lucide.createIcons();
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        container.classList.add('hidden');
      }, 3000);
    }

    function triggerImpactEffect(text) {
      state.hitNotification = text;
      state.screenShake = true;
      render();
      setTimeout(() => { state.screenShake = false; render(); }, 500);
      setTimeout(() => { state.hitNotification = null; render(); }, 3500);
    }

    function updateHeaderUI() {
      const badge = document.getElementById('sync-badge');
      if (state.syncStatus === 'online') {
        badge.className = "bg-emerald-950/80 border border-emerald-600/60 text-emerald-300 px-2.5 py-1 rounded-lg flex items-center space-x-1.5";
        badge.innerHTML = `<i data-lucide="wifi" class="w-3.5 h-3.5 text-emerald-400 animate-pulse"></i><span class="font-bold">オンライン通信中</span>`;
      } else if (state.syncStatus === 'error') {
        badge.className = "bg-red-950/80 border border-red-600/60 text-red-300 px-2.5 py-1 rounded-lg flex items-center space-x-1.5";
        badge.innerHTML = `<i data-lucide="wifi-off" class="w-3.5 h-3.5 text-red-400"></i><span class="font-bold">同期エラー</span>`;
      } else if (state.syncStatus === 'local' || state.isLocalDemo) {
        badge.className = "bg-amber-950/80 border border-amber-600/60 text-amber-300 px-2.5 py-1 rounded-lg flex items-center space-x-1.5";
        badge.innerHTML = `<i data-lucide="user" class="w-3.5 h-3.5"></i><span class="font-bold">ローカルテスト中</span>`;
      }

      const roomInfo = document.getElementById('header-room-info');
      if (state.gameState) {
        roomInfo.classList.remove('hidden');
        document.getElementById('header-room-id').textContent = state.roomId;
        document.getElementById('header-player-count').textContent = `${state.gameState.playerCount}人環状戦`;
      } else {
        roomInfo.classList.add('hidden');
      }
    }

    function syncTurnAutoFocus() {
      const gs = state.gameState;
      if (!gs || gs.status !== 'playing' || !state.autoFollowTurn) return;
      const activeIndex = state.isLocalDemo ? state.demoViewIndex : state.myPlayerIndex;
      const currentTurn = gs.turnIndex;

      if (currentTurn === activeIndex) {
        state.mainViewMode = 'explore';
      } else {
        const targetOfCurrentTurn = (currentTurn + 1) % gs.playerCount;
        state.mainViewMode = (targetOfCurrentTurn === activeIndex) ? 'defense' : 'spectate';
      }
    }

    // --- FIREBASE AUTH & LISTENER ---
    async function initFirebase() {
      if (!auth) {
        state.syncStatus = 'local';
        render();
        return;
      }
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
        state.syncStatus = 'online';
      } catch (e) {
        console.error("Auth error:", e);
        state.syncStatus = 'error';
        state.syncErrorMsg = e.message || 'Firebase認証エラー';
      }
      onAuthStateChanged(auth, (u) => {
        state.user = u;
        if (u) state.syncStatus = 'online';
        render();
      });
    }

    function subscribeToRoom(rId) {
      if (unsubscribeRoom) unsubscribeRoom();
      if (!db || !rId || state.isLocalDemo) return;
      const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', rId);
      unsubscribeRoom = onSnapshot(roomRef, (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          const turnChanged = state.lastTurnIndex !== data.turnIndex;
          state.gameState = data;
          state.syncStatus = 'online';
          if (turnChanged) {
            state.lastTurnIndex = data.turnIndex;
            syncTurnAutoFocus();
          }
          render();
        } else {
          state.syncErrorMsg = '指定されたルームが存在しないか削除されました';
          render();
        }
      }, (err) => {
        console.error("Firestore sync error:", err);
        state.syncStatus = 'error';
        state.syncErrorMsg = 'Firestore接続エラー（セキュリティルールをご確認ください）';
        render();
      });
    }

    async function saveGameState(updatedState) {
      if (state.isLocalDemo || !db) {
        const turnChanged = state.lastTurnIndex !== updatedState.turnIndex;
        state.gameState = updatedState;
        if (turnChanged) {
          state.lastTurnIndex = updatedState.turnIndex;
          syncTurnAutoFocus();
        }
        render();
      } else {
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', state.roomId), updatedState);
      }
    }

    // --- GAME ACTIONS ---
    async function handleCreateRoom(lvl, pCount) {
      const newRoomId = Math.floor(1000 + Math.random() * 9000).toString();
      const initPlayers = [{
        id: 'p0',
        name: state.nickname || '勇者A',
        ready: false,
        dungeon: null,
        pos: { floor: 'b1', r: 0, c: 0 },
        baseAtk: 5,
        sword: false,
        armor: false,
        princessRescued: false,
        skipTurn: false,
        cards: [],
        radar: { b1: {}, b2: {} },
        memo: { b1: {}, b2: {} }
      }];

      const initialData = {
        roomId: newRoomId,
        level: lvl,
        playerCount: pCount,
        status: 'waiting',
        turnIndex: 0,
        winnerIndex: null,
        logs: [`【システム】${pCount}人対戦ルーム #${newRoomId} を作成しました。`],
        players: initPlayers
      };

      state.builderDungeon = { b1: createEmptyGrid(B1_SIZE, B1_SIZE), b2: createEmptyGrid(B2_SIZE, B2_SIZE) };

      if (state.isLocalDemo || !db) {
        for (let i = 1; i < pCount; i++) {
          initialData.players.push({
            id: `p${i}`,
            name: `勇者${String.fromCharCode(65 + i)}`,
            ready: false,
            dungeon: null,
            pos: { floor: 'b1', r: 0, c: 0 },
            baseAtk: 5,
            sword: false,
            armor: false,
            princessRescued: false,
            skipTurn: false,
            cards: [],
            radar: { b1: {}, b2: {} },
            memo: { b1: {}, b2: {} }
          });
        }
        initialData.status = 'building';
        state.gameState = initialData;
        state.roomId = newRoomId;
        state.myPlayerIndex = 0;
        render();
      } else {
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', newRoomId), initialData);
        state.roomId = newRoomId;
        state.myPlayerIndex = 0;
        subscribeToRoom(newRoomId);
      }
    }

    async function handleJoinRoom() {
      const rId = state.inputRoomId.trim();
      if (!rId) { showToast('4桁のルームIDを入力してください'); return; }
      if (!db) { showToast('オフラインモードではルーム参加できません'); return; }

      const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', rId);
      const snap = await getDoc(roomRef);
      if (!snap.exists()) { showToast('ルームが存在しません'); return; }

      const roomData = snap.data();
      if (roomData.players.length >= roomData.playerCount) { showToast('満員です'); return; }

      const newIdx = roomData.players.length;
      const newPlayer = {
        id: `p${newIdx}`,
        name: state.nickname || `勇者${String.fromCharCode(65 + newIdx)}`,
        ready: false,
        dungeon: null,
        pos: { floor: 'b1', r: 0, c: 0 },
        baseAtk: 5,
        sword: false,
        armor: false,
        princessRescued: false,
        skipTurn: false,
        cards: [],
        radar: { b1: {}, b2: {} },
        memo: { b1: {}, b2: {} }
      };

      roomData.players.push(newPlayer);
      roomData.logs.unshift(`【システム】${newPlayer.name} が参加しました。(${roomData.players.length}/${roomData.playerCount})`);

      if (roomData.players.length === roomData.playerCount) {
        roomData.status = 'building';
        roomData.logs.unshift('【システム】全プレイヤーが揃いました！迷宮作成フェイズを開始します。');
      }

      await setDoc(roomRef, roomData);
      state.roomId = rId;
      state.myPlayerIndex = newIdx;
      state.gameState = roomData;
      state.builderDungeon = { b1: createEmptyGrid(B1_SIZE, B1_SIZE), b2: createEmptyGrid(B2_SIZE, B2_SIZE) };
      subscribeToRoom(rId);
      render();
    }

    async function handleReadyBuilder() {
      const gs = state.gameState;
      const check = validateDungeon(state.builderDungeon, gs.level);
      if (!check.valid) { showToast(check.msg); return; }

      const activeIndex = state.isLocalDemo ? state.demoViewIndex : state.myPlayerIndex;
      const updated = JSON.parse(JSON.stringify(gs));
      updated.players[activeIndex].ready = true;
      updated.players[activeIndex].dungeon = state.builderDungeon;
      updated.logs.unshift(`【システム】${updated.players[activeIndex].name} が迷宮作成を完了！`);

      if (updated.players.every(p => p.ready)) {
        updated.status = 'playing';
        updated.logs.unshift('【システム】全プレイヤーの迷宮が完成！探索を開始します。');
        const pCount = updated.playerCount;
        for (let i = 0; i < pCount; i++) {
          const targetIdx = (i + 1) % pCount;
          const targetDungeon = updated.players[targetIdx].dungeon;
          let startPos = { floor: 'b1', r: 0, c: 0 };
          for (let r = 0; r < B1_SIZE; r++) {
            for (let c = 0; c < B1_SIZE; c++) {
              if (targetDungeon.b1[r][c].type === 'start') startPos = { floor: 'b1', r, c };
            }
          }
          updated.players[i].pos = startPos;
          updated.players[i].radar.b1[`${startPos.r}_${startPos.c}`] = 'start';
        }
      }

      await saveGameState(updated);
      audio.fanfare();
    }

    async function handleRadarTileClick(r, c) {
      const gs = state.gameState;
      const activeIndex = state.isLocalDemo ? state.demoViewIndex : state.myPlayerIndex;
      if (!gs || gs.status !== 'playing') return;
      if (gs.turnIndex !== activeIndex) { showToast('相手の手番です！交代をお待ちください。'); return; }

      const pCount = gs.playerCount;
      const targetIdx = (activeIndex + 1) % pCount;
      const me = gs.players[activeIndex];
      const targetPlayer = gs.players[targetIdx];
      const targetDungeon = targetPlayer.dungeon;

      if (me.pos.floor !== state.radarFloor) {
        showToast(`現在は ${me.pos.floor.toUpperCase()} に位置しています。視界階層を切り替えてください。`);
        return;
      }
      if (Math.abs(me.pos.r - r) + Math.abs(me.pos.c - c) !== 1) {
        showToast('上下左右に隣接する1マスのみ移動探索できます。');
        return;
      }

      const targetCell = targetDungeon[state.radarFloor][r][c];
      const updated = JSON.parse(JSON.stringify(gs));
      const activeMe = updated.players[activeIndex];
      const key = `${r}_${c}`;
      const colLabel = state.radarFloor === 'b1' ? COLS_B1[c] : COLS_B2[c];

      if (targetCell.type === 'wall') {
        audio.wall();
        triggerImpactEffect(`壁に衝突！手番終了 (${colLabel}${r + 1})`);
        activeMe.radar[state.radarFloor][key] = 'wall';
        updated.logs.unshift(`【${activeMe.name}】(${colLabel}${r + 1}) は壁でした！手番交代。`);

        let nextTurn = (activeIndex + 1) % pCount;
        if (updated.players[nextTurn].skipTurn) {
          updated.players[nextTurn].skipTurn = false;
          updated.logs.unshift(`【システム】${updated.players[nextTurn].name} は1回休みの為手番がスキップされました。`);
          nextTurn = (nextTurn + 1) % pCount;
        }
        updated.turnIndex = nextTurn;
      } else {
        audio.step();
        activeMe.pos = { floor: state.radarFloor, r, c };
        activeMe.radar[state.radarFloor][key] = 'open';

        if (targetCell.type === 'boss') {
          if (gs.level === 1) {
            audio.fanfare();
            updated.status = 'finished';
            updated.winnerIndex = activeIndex;
            updated.logs.unshift(`【勝利！】${activeMe.name} が ${targetPlayer.name} の迷宮の魔王に到達し、勝利しました！`);
          } else {
            openBattleModal({
              enemyName: '魔王 (大ボス)',
              hp: 15,
              isBoss: true,
              drawCard: false
            });
          }
        } else if (targetCell.type === 'pitfall') {
          audio.teleport();
          triggerImpactEffect('落とし穴に落下！');
          let landR = 0, landC = 0;
          for (let lr = 0; lr < B2_SIZE; lr++) {
            for (let lc = 0; lc < B2_SIZE; lc++) {
              if (targetDungeon.b2[lr][lc].type === 'landing') { landR = lr; landC = lc; }
            }
          }
          activeMe.pos = { floor: 'b2', r: landR, c: landC };
          activeMe.radar.b2[`${landR}_${landC}`] = 'landing';
          state.radarFloor = 'b2';
          updated.logs.unshift(`【罠！】${activeMe.name} が落とし穴に落下！B2F (${COLS_B2[landC]}${landR + 1}) へ移転。`);
        } else if (targetCell.type === 'ladder') {
          audio.teleport();
          let pitR = 0, pitC = 0;
          for (let pr = 0; pr < B1_SIZE; pr++) {
            for (let pc = 0; pc < B1_SIZE; pc++) {
              if (targetDungeon.b1[pr][pc].type === 'pitfall') { pitR = pr; pitC = pc; }
            }
          }
          activeMe.pos = { floor: 'b1', r: pitR, c: pitC };
          activeMe.radar.b1[`${pitR}_${pitC}`] = 'pitfall';
          state.radarFloor = 'b1';
          updated.logs.unshift(`【ハシゴ】${activeMe.name} がハシゴから B1F (${COLS_B1[pitC]}${pitR + 1}) へ帰還！`);
        } else if (targetCell.type === 'princess') {
          audio.chest();
          activeMe.princessRescued = true;
          activeMe.baseAtk = 6;
          updated.players[targetIdx].dungeon[state.radarFloor][r][c].type = 'empty';
          updated.logs.unshift(`【救出！】${activeMe.name} が王女を救出！基本攻撃力 +1。`);
        } else if (targetCell.type === 'chest') {
          audio.chest();
          const cType = targetCell.details.chestType;
          updated.players[targetIdx].dungeon[state.radarFloor][r][c].type = 'empty';
          if (cType === 'sword') {
            activeMe.sword = true;
            updated.logs.unshift(`【宝箱】${activeMe.name} が『伝説の聖剣』を獲得！ (攻撃力 +3)`);
          } else if (cType === 'armor') {
            activeMe.armor = true;
            updated.logs.unshift(`【宝箱】${activeMe.name} が『光の聖鎧』を獲得！ (攻撃力 +3)`);
          } else {
            openBattleModal({
              enemyName: '人食い箱 (ミミック)',
              hp: 11,
              isBoss: false,
              drawCard: false
            });
          }
        } else if (targetCell.type === 'monster') {
          const mInfo = targetCell.details;
          updated.players[targetIdx].dungeon[state.radarFloor][r][c].type = 'empty';
          openBattleModal({
            enemyName: mInfo.name,
            hp: mInfo.hp,
            isBoss: false,
            drawCard: true
          });
        } else {
          updated.logs.unshift(`【${activeMe.name}】(${state.radarFloor.toUpperCase()} ${colLabel}${r + 1}) は通路でした！連続手番。`);
        }
      }

      await saveGameState(updated);
    }

    function openBattleModal(info) {
      state.battleModal = info;
      state.diceValue = null;
      state.diceRolling = false;

      const activeIndex = state.isLocalDemo ? state.demoViewIndex : state.myPlayerIndex;
      const me = state.gameState.players[activeIndex];
      const atk = me.baseAtk + (me.sword ? 3 : 0) + (me.armor ? 3 : 0);

      document.getElementById('battle-enemy-name').textContent = `${info.enemyName} 出現！`;
      document.getElementById('battle-enemy-hp').textContent = info.hp;
      document.getElementById('battle-player-atk').textContent = atk;
      document.getElementById('battle-dice-val').textContent = '+ ?';
      document.getElementById('battle-total-val').textContent = '?';
      document.getElementById('battle-dice-box').textContent = '🎲';
      document.getElementById('battle-dice-box').classList.remove('animate-spin');
      document.getElementById('btn-roll-dice').disabled = false;
      document.getElementById('btn-roll-text').textContent = 'サイコロを振る！';

      const modal = document.getElementById('battle-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeBattleModal() {
      state.battleModal = null;
      const modal = document.getElementById('battle-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    async function handleRollDice() {
      if (state.diceRolling || !state.battleModal) return;
      state.diceRolling = true;
      audio.dice();

      const btn = document.getElementById('btn-roll-dice');
      const diceBox = document.getElementById('battle-dice-box');
      btn.disabled = true;
      document.getElementById('btn-roll-text').textContent = 'ダイスロール中...';
      diceBox.classList.add('animate-spin');

      let count = 0;
      const interval = setInterval(() => {
        diceBox.textContent = Math.floor(Math.random() * 6) + 1;
        count++;
        if (count > 10) {
          clearInterval(interval);
          const finalRoll = Math.floor(Math.random() * 6) + 1;
          diceBox.classList.remove('animate-spin');
          diceBox.textContent = finalRoll;
          state.diceRolling = false;

          const activeIndex = state.isLocalDemo ? state.demoViewIndex : state.myPlayerIndex;
          const me = state.gameState.players[activeIndex];
          const playerAtk = me.baseAtk + (me.sword ? 3 : 0) + (me.armor ? 3 : 0);
          const total = playerAtk + finalRoll;

          document.getElementById('battle-dice-val').textContent = `+ ${finalRoll}`;
          document.getElementById('battle-total-val').textContent = total;

          const info = state.battleModal;
          setTimeout(async () => {
            closeBattleModal();
            const updated = JSON.parse(JSON.stringify(state.gameState));
            const activeMe = updated.players[activeIndex];

            if (total >= info.hp) {
              audio.fanfare();
              if (info.isBoss) {
                updated.status = 'finished';
                updated.winnerIndex = activeIndex;
                updated.logs.unshift(`【大勝利！】${activeMe.name} が魔王を討伐し、ダンジョンを完全攻略しました！`);
              } else if (info.drawCard && updated.level === 3) {
                const drawn = CARD_TYPES[Math.floor(Math.random() * CARD_TYPES.length)];
                activeMe.cards.push(drawn);
                updated.logs.unshift(`【撃破！】${activeMe.name} が敵を倒し、『${drawn.name}』を獲得！`);
              } else {
                updated.logs.unshift(`【撃破！】${activeMe.name} が戦闘に勝利しました！手番継続。`);
              }
            } else {
              audio.defeat();
              const sekaijuIdx = activeMe.cards.findIndex(c => c.id === 'sekaiju');
              if (sekaijuIdx !== -1) {
                activeMe.cards.splice(sekaijuIdx, 1);
                updated.logs.unshift(`【敗北】${activeMe.name} は敗北しましたが、『奇跡の雫』により1回休みを回避！`);
              } else {
                activeMe.skipTurn = true;
                updated.logs.unshift(`【敗北】${activeMe.name} は敗北！次回の1回が休みになります。`);
                let nextTurn = (activeIndex + 1) % updated.playerCount;
                if (updated.players[nextTurn].skipTurn) {
                  updated.players[nextTurn].skipTurn = false;
                  nextTurn = (nextTurn + 1) % updated.playerCount;
                }
                updated.turnIndex = nextTurn;
              }
            }
            await saveGameState(updated);
          }, 700);
        }
      }, 80);
    }

              const oppExplored = invaderPlayer.radar[state.defenseFloor]?.[key];
              const isEnemyHere = invaderPlayer.pos.floor === state.defenseFloor && invaderPlayer.pos.r === r && invaderPlayer.pos.c === c;

              let cls = 'bg-stone-950 border border-stone-800 text-stone-600';
              let content = '';
              if (isEnemyHere) {
                cls = 'bg-red-600 border-red-300 text-white shadow-lg ring-4 ring-red-500/50 z-20 animate-bounce scale-110';
                content = '💀';
              } else if (oppExplored === 'wall') { cls = 'bg-red-950/80 border-2 border-red-600 text-red-300'; content = '💥'; }
              else if (oppExplored === 'open') { cls = 'bg-amber-950/40 border border-amber-600/40 text-amber-300'; content = '🐾'; }
              else {
                if (cell?.type === 'wall') cls = 'bg-stone-900 border border-stone-800 text-stone-700';
                const iconMap = { wall: '🧱', start: '🚩', boss: '👿', pitfall: '🕳️', landing: '🎯', ladder: '🪜', chest: '🧰', monster: '👾', princess: '👸' };
                if (iconMap[cell?.type]) content = `<span class="opacity-45 text-xs sm:text-sm">${iconMap[cell.type]}</span>`;
              }
              cellsHtml += `<div class="w-8 h-8 sm:w-12 sm:h-12 md:w-14 md:h-14 border rounded-xl flex items-center justify-center text-base sm:text-lg font-bold transition relative select-none mr-1 ${cls}">${content}</div>`;
            }
            rowsHtml += `
              <div class="flex items-center mb-1">
                <div class="w-6 sm:w-8 text-xs font-mono font-bold text-stone-500 text-right pr-2">${r + 1}</div>
                ${cellsHtml}
              </div>
            `;
          }

          mainBoardHtml = `
            <div class="bg-stone-950 border-2 border-red-900/40 rounded-2xl p-4 sm:p-6 shadow-2xl flex flex-col justify-between">
              <div>
                <div class="flex flex-wrap justify-between items-center mb-4 gap-2 border-b border-stone-800 pb-3">
                  <div>
                    <h2 class="text-xl font-bold text-red-400 font-serif-jp flex items-center space-x-2">
                      <i data-lucide="shield" class="w-5 h-5 text-red-500"></i>
                      <span>自軍防衛状況（侵入者: ${invaderPlayer.name}）</span>
                    </h2>
                    <p class="text-xs text-stone-400 mt-0.5">
                      侵入者の現在位置: <span class="text-red-400 font-bold">${invaderPlayer.pos.floor.toUpperCase()} (${(invaderPlayer.pos.floor === 'b1' ? COLS_B1 : COLS_B2)[invaderPlayer.pos.c]}${invaderPlayer.pos.r + 1})</span>
                    </p>
                  </div>
                  ${rule.b2 ? `
                    <div class="flex bg-stone-900 rounded-lg p-1 border border-stone-800">
                      <button id="btn-dfloor-b1" class="px-3 py-1 rounded-md text-xs font-bold transition ${state.defenseFloor === 'b1' ? 'bg-red-600 text-white' : 'text-stone-400'}">B1F 防衛</button>
                      <button id="btn-dfloor-b2" class="px-3 py-1 rounded-md text-xs font-bold transition ${state.defenseFloor === 'b2' ? 'bg-red-600 text-white' : 'text-stone-400'}">B2F 防衛</button>
                    </div>
                  ` : ''}
                </div>

                <div class="flex justify-center my-2 overflow-x-auto">
                  <div class="bg-stone-950 p-3 sm:p-5 rounded-2xl border-2 border-stone-800 shadow-2xl">
                    <div class="flex ml-6 sm:ml-8 mb-1">
                      ${cols.map(col => `<div class="w-8 sm:w-12 md:w-14 text-center text-xs font-mono font-bold text-stone-500 mr-1">${col}</div>`).join('')}
                    </div>
                    ${rowsHtml}
                  </div>
                </div>
              </div>
              <div class="mt-4 bg-red-950/30 border border-red-900/50 p-3 rounded-xl text-center text-xs text-red-300">
                🛡️ 【${invaderPlayer.name}】があなたの迷宮を進行中！
              </div>
            </div>
          `;
        }

        // VIEW 3: SPECTATE
        if (state.mainViewMode === 'spectate') {
          const cols = state.spectateFloor === 'b1' ? COLS_B1 : COLS_B2;
          const size = state.spectateFloor === 'b1' ? B1_SIZE : B2_SIZE;
          let rowsHtml = '';
          for (let r = 0; r < size; r++) {
            let cellsHtml = '';
            for (let c = 0; c < size; c++) {
              const key = `${r}_${c}`;
              const explored = currentTurnPlayer.radar[state.spectateFloor]?.[key];
              const isTurnHeroHere = currentTurnPlayer.pos.floor === state.spectateFloor && currentTurnPlayer.pos.r === r && currentTurnPlayer.pos.c === c;

              let cls = 'bg-stone-900 border border-stone-800 text-stone-700';
              let content = '';
              if (isTurnHeroHere) {
                cls = 'bg-indigo-600 border-indigo-300 text-white shadow-lg ring-4 ring-indigo-500/50 z-20 animate-pulse scale-105';
                content = '🚶';
              } else if (explored === 'wall') { cls = 'bg-red-950/80 border border-red-800 text-red-400'; content = '❌'; }
              else if (explored === 'open') { cls = 'bg-amber-950/40 border border-amber-700/40 text-amber-300'; content = '🐾'; }

              cellsHtml += `<div class="w-8 h-8 sm:w-12 sm:h-12 md:w-14 md:h-14 border rounded-xl flex items-center justify-center text-base sm:text-lg font-bold transition relative select-none mr-1 ${cls}">${content}</div>`;
            }
            rowsHtml += `
              <div class="flex items-center mb-1">
                <div class="w-6 sm:w-8 text-xs font-mono font-bold text-stone-500 text-right pr-2">${r + 1}</div>
                ${cellsHtml}
              </div>
            `;
          }

          mainBoardHtml = `
            <div class="bg-stone-950 border-2 border-indigo-900/40 rounded-2xl p-4 sm:p-6 shadow-2xl flex flex-col justify-between">
              <div>
                <div class="flex flex-wrap justify-between items-center mb-4 gap-2 border-b border-stone-800 pb-3">
                  <div>
                    <h2 class="text-xl font-bold text-indigo-400 font-serif-jp flex items-center space-x-2">
                      <i data-lucide="eye" class="w-5 h-5 text-indigo-400"></i>
                      <span>他プレイヤーリアルタイム観戦</span>
                    </h2>
                    <p class="text-xs text-stone-400 mt-0.5">
                      探索中: <span class="text-amber-300 font-bold">${currentTurnPlayer.name}</span> ➔ 攻略中: <span class="text-indigo-300 font-bold">${currentTurnTargetPlayer.name} の迷宮</span>
                    </p>
                  </div>
                  ${rule.b2 ? `
                    <div class="flex bg-stone-900 rounded-lg p-1 border border-stone-800">
                      <button id="btn-sfloor-b1" class="px-3 py-1 rounded-md text-xs font-bold transition ${state.spectateFloor === 'b1' ? 'bg-indigo-600 text-white' : 'text-stone-400'}">B1F 観戦</button>
                      <button id="btn-sfloor-b2" class="px-3 py-1 rounded-md text-xs font-bold transition ${state.spectateFloor === 'b2' ? 'bg-indigo-600 text-white' : 'text-stone-400'}">B2F 観戦</button>
                    </div>
                  ` : ''}
                </div>

                <div class="flex justify-center my-2 overflow-x-auto">
                  <div class="bg-stone-950 p-3 sm:p-5 rounded-2xl border-2 border-stone-800 shadow-2xl">
                    <div class="flex ml-6 sm:ml-8 mb-1">
                      ${cols.map(col => `<div class="w-8 sm:w-12 md:w-14 text-center text-xs font-mono font-bold text-stone-500 mr-1">${col}</div>`).join('')}
                    </div>
                    ${rowsHtml}
                  </div>
                </div>
              </div>
              <div class="mt-4 bg-indigo-950/30 border border-indigo-900/50 p-3 rounded-xl text-center text-xs text-indigo-300">
                👁️ 観戦モード中：【${currentTurnPlayer.name}】が【${currentTurnTargetPlayer.name}】の迷宮を攻略中
              </div>
            </div>
          `;
        }

        root.innerHTML = `
          <div class="flex flex-col gap-4 ${state.screenShake ? 'animate-shake' : ''}">
            ${topBannersHtml}

            <!-- TURN & VIEW CONTROL BAR -->
            <div class="bg-stone-950 border border-stone-800 rounded-2xl p-3 flex flex-wrap justify-between items-center gap-3 shadow-xl">
              <div class="flex items-center space-x-3 flex-wrap gap-y-2">
                <div class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold flex items-center space-x-2 shadow ${
                  gs.turnIndex === activeIndex
                    ? 'bg-gradient-to-r from-amber-500 to-amber-600 text-stone-950 animate-pulse'
                    : 'bg-stone-800 text-stone-300 border border-stone-700'
                }">
                  ${gs.turnIndex === activeIndex
                    ? `<i data-lucide="crosshair" class="w-4 h-4"></i><span>あなたの探索ターン！ (攻略対象: ${targetPlayer.name})</span>`
                    : `<i data-lucide="eye" class="w-4 h-4 text-amber-400"></i><span>【${currentTurnPlayer.name}】 の探索中... (対象: ${currentTurnTargetPlayer.name})</span>`
                  }
                </div>

                ${state.hitNotification ? `
                  <div class="bg-red-950/90 border border-red-500 text-red-200 text-xs px-3 py-1 rounded-xl font-bold animate-pulse flex items-center space-x-1">
                    <i data-lucide="alert-triangle" class="w-3.5 h-3.5 text-red-400"></i>
                    <span>${state.hitNotification}</span>
                  </div>
                ` : ''}
              </div>

              <div class="flex items-center space-x-2 flex-wrap gap-y-2">
                <div class="flex bg-stone-900 rounded-xl p-1 border border-stone-800 text-xs font-bold">
                  <button id="btn-view-explore" class="px-3 py-1.5 rounded-lg transition flex items-center space-x-1 ${state.mainViewMode === 'explore' ? 'bg-amber-600 text-stone-950' : 'text-stone-400 hover:text-stone-200'}">
                    <i data-lucide="map" class="w-3.5 h-3.5"></i><span>攻略冒険の書 (${targetPlayer.name})</span>
                  </button>
                  <button id="btn-view-defense" class="px-3 py-1.5 rounded-lg transition flex items-center space-x-1 ${state.mainViewMode === 'defense' ? 'bg-amber-600 text-stone-950' : 'text-stone-400 hover:text-stone-200'}">
                    <i data-lucide="shield" class="w-3.5 h-3.5"></i><span>自軍防衛 (${invaderPlayer.name})</span>
                  </button>
                  ${gs.playerCount === 3 ? `
                    <button id="btn-view-spectate" class="px-3 py-1.5 rounded-lg transition flex items-center space-x-1 ${state.mainViewMode === 'spectate' ? 'bg-amber-600 text-stone-950' : 'text-stone-400 hover:text-stone-200'}">
                      <i data-lucide="eye" class="w-3.5 h-3.5"></i><span>他プレイヤー観戦</span>
                    </button>
                  ` : ''}
                </div>

                <button id="btn-auto-follow" class="p-2 rounded-xl border text-xs font-semibold transition ${state.autoFollowTurn ? 'bg-amber-950/60 border-amber-500/80 text-amber-300' : 'bg-stone-900 border-stone-800 text-stone-500'}">
                  ${state.autoFollowTurn ? '🔄 自動追従 ON' : '🔒 固定'}
                </button>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <div class="lg:col-span-8 flex flex-col gap-4">${mainBoardHtml}</div>

              <div class="lg:col-span-4 flex flex-col gap-4">
                <div class="bg-stone-950 border border-stone-800 rounded-2xl p-4 shadow-xl">
                  <div class="flex justify-between items-center mb-3 border-b border-stone-800 pb-2.5">
                    <div>
                      <h3 class="font-bold text-base text-amber-400 font-serif-jp">${mePlayer.name}</h3>
                      <p class="text-[11px] text-stone-400">現在地: ${mePlayer.pos.floor.toUpperCase()}</p>
                    </div>
                    <div class="bg-amber-950/60 border border-amber-600/60 px-3 py-1 rounded-xl text-center">
                      <div class="text-[10px] text-amber-400 font-semibold">攻撃力</div>
                      <div class="text-lg font-extrabold text-amber-300 font-mono">${myAtk}</div>
                    </div>
                  </div>

                  <div class="grid grid-cols-3 gap-2 text-center text-[11px] mb-3">
                    <div class="p-2 rounded-xl border ${mePlayer.sword ? 'bg-amber-950/60 border-amber-500 text-amber-300' : 'bg-stone-900 border-stone-800 text-stone-600'}">
                      <div class="text-sm">⚔️</div><div class="font-bold">聖剣</div><div class="text-[9px] opacity-75">${mePlayer.sword ? '+3' : '未'}</div>
                    </div>
                    <div class="p-2 rounded-xl border ${mePlayer.armor ? 'bg-amber-950/60 border-amber-500 text-amber-300' : 'bg-stone-900 border-stone-800 text-stone-600'}">
                      <div class="text-sm">🛡️</div><div class="font-bold">聖鎧</div><div class="text-[9px] opacity-75">${mePlayer.armor ? '+3' : '未'}</div>
                    </div>
                    <div class="p-2 rounded-xl border ${mePlayer.princessRescued ? 'bg-pink-950/60 border-pink-500 text-pink-300' : 'bg-stone-900 border-stone-800 text-stone-600'}">
                      <div class="text-sm">👸</div><div class="font-bold">王女</div><div class="text-[9px] opacity-75">${mePlayer.princessRescued ? '救出' : '未'}</div>
                    </div>
                  </div>

                  ${gs.level === 3 ? `
                    <div class="border-t border-stone-800 pt-2.5">
                      <div class="text-[11px] font-semibold text-stone-400 mb-1.5">冒険カード (${mePlayer.cards.length}枚)</div>
                      <div class="flex flex-wrap gap-1">
                        ${mePlayer.cards.length === 0
                          ? `<span class="text-[10px] text-stone-600 italic">所持カードなし</span>`
                          : mePlayer.cards.map((card, idx) => `
                            <button data-card-idx="${idx}" class="btn-use-card bg-amber-950 border border-amber-600/60 text-amber-300 text-[10px] px-2 py-0.5 rounded flex items-center space-x-1">
                              <span>✨ ${card.name}</span>
                            </button>
                          `).join('')}
                      </div>
                    </div>
                  ` : ''}
                </div>

                <div class="bg-stone-950 border border-stone-800 rounded-2xl p-4 flex-1 flex flex-col justify-between shadow-xl min-h-[180px]">
                  <h3 class="font-bold text-[11px] text-stone-400 mb-2 uppercase tracking-wider">冒険記録 (ログ)</h3>
                  <div class="flex-1 bg-stone-900/60 rounded-xl p-3 border border-stone-800/80 overflow-y-auto max-h-56 space-y-1.5 font-mono text-[11px] text-stone-300">
                    ${gs.logs.map(log => `<div class="border-b border-stone-800/40 pb-1">${log}</div>`).join('')}
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;

        // Bind Playing Events
        document.querySelectorAll('.btn-demo-switch').forEach(btn => {
          btn.onclick = () => { state.demoViewIndex = Number(btn.dataset.demoIdx); syncTurnAutoFocus(); render(); };
        });
        document.getElementById('btn-view-explore').onclick = () => { state.mainViewMode = 'explore'; state.autoFollowTurn = false; render(); };
        document.getElementById('btn-view-defense').onclick = () => { state.mainViewMode = 'defense'; state.autoFollowTurn = false; render(); };
        if (document.getElementById('btn-view-spectate')) {
          document.getElementById('btn-view-spectate').onclick = () => { state.mainViewMode = 'spectate'; state.autoFollowTurn = false; render(); };
        }
        document.getElementById('btn-auto-follow').onclick = () => { state.autoFollowTurn = !state.autoFollowTurn; syncTurnAutoFocus(); render(); };

        if (document.getElementById('btn-rfloor-b1')) document.getElementById('btn-rfloor-b1').onclick = () => { state.radarFloor = 'b1'; render(); };
        if (document.getElementById('btn-rfloor-b2')) document.getElementById('btn-rfloor-b2').onclick = () => { state.radarFloor = 'b2'; render(); };
        if (document.getElementById('btn-dfloor-b1')) document.getElementById('btn-dfloor-b1').onclick = () => { state.defenseFloor = 'b1'; render(); };
        if (document.getElementById('btn-dfloor-b2')) document.getElementById('btn-dfloor-b2').onclick = () => { state.defenseFloor = 'b2'; render(); };
        if (document.getElementById('btn-sfloor-b1')) document.getElementById('btn-sfloor-b1').onclick = () => { state.spectateFloor = 'b1'; render(); };
        if (document.getElementById('btn-sfloor-b2')) document.getElementById('btn-sfloor-b2').onclick = () => { state.spectateFloor = 'b2'; render(); };

        document.querySelectorAll('.btn-memo').forEach(btn => {
          btn.onclick = () => { state.activeMemoTool = btn.dataset.memo; render(); };
        });

        document.querySelectorAll('.r-cell').forEach(btn => {
          const r = Number(btn.dataset.r), c = Number(btn.dataset.c);
          btn.onclick = () => handleRadarTileClick(r, c);
          btn.oncontextmenu = async (e) => {
            e.preventDefault();
            const updated = JSON.parse(JSON.stringify(state.gameState));
            const memoMap = updated.players[activeIndex].memo[state.radarFloor] || {};
            const key = `${r}_${c}`;
            if (state.activeMemoTool === 'clear') delete memoMap[key];
            else memoMap[key] = state.activeMemoTool;
            updated.players[activeIndex].memo[state.radarFloor] = memoMap;
            await saveGameState(updated);
          };
        });

        document.querySelectorAll('.btn-use-card').forEach(btn => {
          btn.onclick = () => {
            if (gs.turnIndex !== activeIndex) { showToast('自分の手番で使用してください'); return; }
            const cIdx = Number(btn.dataset.cardIdx);
            const card = mePlayer.cards[cIdx];
            showToast(`『${card.name}』: ${card.desc}`);
          };
        });

        lucide.createIcons();
        return;
      }

      // 5. FINISHED SCREEN
      if (gs.status === 'finished') {
        const winner = gs.players[gs.winnerIndex];
        root.innerHTML = `
          <div class="bg-stone-950 border-2 border-amber-500 rounded-2xl p-8 max-w-2xl mx-auto text-center shadow-2xl w-full">
            <i data-lucide="crown" class="w-16 h-16 mx-auto text-amber-400 mb-4 animate-bounce"></i>
            <h2 class="text-3xl font-bold text-amber-300 mb-2 font-serif-jp">迷宮制覇！勝利！</h2>
            <p class="text-xl text-stone-200 mb-6 font-bold">
              勝者: <span class="text-amber-400 font-extrabold">${winner?.name}</span>
            </p>
            <div class="bg-stone-900 p-4 rounded-xl border border-stone-800 mb-6 text-xs text-stone-300 text-left max-h-48 overflow-y-auto space-y-1 font-mono">
              ${gs.logs.slice(0, 10).map(l => `<div>${l}</div>`).join('')}
            </div>
            <button id="btn-back-lobby" class="bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold px-8 py-3 rounded-xl shadow-lg transition">
              ロビーに戻る
            </button>
          </div>
        `;
        document.getElementById('btn-back-lobby').onclick = () => {
          if (unsubscribeRoom) unsubscribeRoom();
          state.gameState = null;
          state.roomId = '';
          render();
        };
        lucide.createIcons();
      }
    }

    // --- GLOBAL CONTROLS ---
    document.getElementById('btn-mute').onclick = () => {
      audio.muted = !audio.muted;
      const icon = document.getElementById('icon-sound');
      icon.setAttribute('data-lucide', audio.muted ? 'volume-x' : 'volume-2');
      icon.className = audio.muted ? 'w-4 h-4 text-red-400' : 'w-4 h-4 text-amber-400';
      lucide.createIcons();
    };

    document.getElementById('btn-roll-dice').onclick = handleRollDice;

    // Boot Application
    initFirebase();
    render();
  </script>
</body>
</html>
